app-id: io.trezor.suite
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: trezor-suite
separate-locales: false
rename-icon: trezor-suite
finish-args:
  - --share=network
  - --device=all
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --system-talk-name=org.bluez
  - --talk-name=org.freedesktop.secrets
modules:
  - name: unappimage
    buildsystem: simple
    build-options:
      cflags: -Wno-incompatible-pointer-types
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin ZSTD_SUPPORT=1
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a

  - name: trezor-suite
    buildsystem: simple
    sources:
      - type: extra-data
        only-arches: [x86_64]
        url: https://data.trezor.io/suite/releases/desktop/v26.11.2/Trezor-Suite-26.11.2-linux-x86_64.AppImage
        size: 179440643
        sha256: ec440525be7f52607168226fbb15d412353023573b79724cdad688692f848e3d
        filename: Trezor-Suite.AppImage

      - type: extra-data
        only-arches: [aarch64]
        url: https://data.trezor.io/suite/releases/desktop/v26.11.2/Trezor-Suite-26.11.2-linux-arm64.AppImage
        size: 179232217
        sha256: 08636f19bf55c7114fa9f8dc514d2ac3182559a9d1d5b471cfab1004de944d4f
        filename: Trezor-Suite.AppImage

      - type: script
        dest-filename: trezor-suite
        commands:
          - exec zypak-wrapper /app/extra/bin/trezor-suite "$@"

      - type: file
        path: io.trezor.suite.appdata.xml

      - type: file
        path: io.trezor.suite.desktop

      - type: file
        path: apply_extra.sh

      - type: file
        path: icons/trezor-suite.png

    build-commands:
      - install -Dm755 apply_extra.sh "${FLATPAK_DEST}/bin/apply_extra"
      - install -Dm755 trezor-suite "${FLATPAK_DEST}/bin/trezor-suite"
      - install -Dm644 io.trezor.suite.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm644 io.trezor.suite.appdata.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.appdata.xml"
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps trezor-suite.png
